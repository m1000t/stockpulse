<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockPulse — AI Trading Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --accent: #00ff88;
    --accent3: #4d9fff;
    --text: #e8e8f0;
    --muted: #6b6b88;
    --buy: #00ff88;
    --sell: #ff4466;
    --hold: #ffcc00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px; position: relative; z-index: 1; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 40px; height: 40px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .logo-text { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .logo-text span { color: var(--accent); }
  .badge { background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.3); color: var(--accent); font-family: 'Space Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 20px; letter-spacing: 1px; }
  .search-label { font-size: 13px; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
  .search-row { display: flex; gap: 12px; margin-bottom: 40px; }
  .search-input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; font-size: 22px; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--text); text-transform: uppercase; letter-spacing: 3px; outline: none; transition: border-color 0.2s; }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,255,136,0.1); }
  .search-input::placeholder { color: var(--muted); font-size: 16px; letter-spacing: 1px; }
  .analyze-btn { background: var(--accent); color: #000; border: none; border-radius: 12px; padding: 16px 32px; font-size: 15px; font-weight: 800; font-family: 'Syne', sans-serif; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .analyze-btn:hover { background: #00cc6e; transform: translateY(-1px); }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .loading { display: none; text-align: center; padding: 60px 20px; }
  .loading.active { display: block; }
  .pulse-ring { width: 60px; height: 60px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-family: 'Space Mono', monospace; color: var(--muted); font-size: 13px; letter-spacing: 2px; }
  .loading-step { color: var(--accent); font-size: 14px; margin-top: 8px; min-height: 20px; }
  .results { display: none; }
  .results.active { display: block; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .signal-banner { border-radius: 16px; padding: 28px 32px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border: 1px solid; }
  .signal-banner.BUY { background: rgba(0,255,136,0.08); border-color: rgba(0,255,136,0.4); }
  .signal-banner.SELL { background: rgba(255,68,102,0.08); border-color: rgba(255,68,102,0.4); }
  .signal-banner.HOLD { background: rgba(255,204,0,0.08); border-color: rgba(255,204,0,0.4); }
  .signal-left { display: flex; align-items: center; gap: 20px; }
  .signal-icon { font-size: 40px; }
  .signal-ticker { font-size: 13px; font-family: 'Space Mono', monospace; color: var(--muted); letter-spacing: 2px; margin-bottom: 4px; }
  .signal-label { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
  .signal-label.BUY { color: var(--buy); } .signal-label.SELL { color: var(--sell); } .signal-label.HOLD { color: var(--hold); }
  .signal-right { text-align: right; }
  .score-label { font-size: 12px; font-family: 'Space Mono', monospace; color: var(--muted); letter-spacing: 1px; margin-bottom: 4px; }
  .score-value { font-size: 48px; font-weight: 800; font-family: 'Space Mono', monospace; letter-spacing: -2px; }
  .score-value.BUY { color: var(--buy); } .score-value.SELL { color: var(--sell); } .score-value.HOLD { color: var(--hold); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } .signal-banner { flex-direction: column; text-align: center; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .card-title { font-size: 11px; font-family: 'Space Mono', monospace; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-title::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; flex-shrink: 0; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
  .stat-label { font-size: 10px; font-family: 'Space Mono', monospace; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
  .stat-value { font-size: 20px; font-weight: 700; font-family: 'Space Mono', monospace; }
  .stat-value.green { color: var(--buy); } .stat-value.red { color: var(--sell); } .stat-value.yellow { color: var(--hold); } .stat-value.blue { color: var(--accent3); }
  .stat-sub { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .indicator-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px; }
  .indicator-row:last-child { border-bottom: none; }
  .ind-left { flex: 1; min-width: 0; }
  .ind-name { font-size: 14px; font-weight: 600; }
  .ind-note { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ind-signal { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 1px; white-space: nowrap; flex-shrink: 0; }
  .ind-signal.bullish { background: rgba(0,255,136,0.15); color: var(--buy); }
  .ind-signal.bearish { background: rgba(255,68,102,0.15); color: var(--sell); }
  .ind-signal.neutral { background: rgba(255,204,0,0.15); color: var(--hold); }
  .chart-wrap { position: relative; height: 200px; }
  .level-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .level-row:last-child { border-bottom: none; }
  .level-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: 1px; min-width: 90px; text-align: center; flex-shrink: 0; }
  .level-tag.resistance { background: rgba(255,68,102,0.15); color: var(--sell); }
  .level-tag.support { background: rgba(0,255,136,0.15); color: var(--buy); }
  .level-tag.current { background: rgba(77,159,255,0.15); color: var(--accent3); }
  .level-price { font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; flex: 1; }
  .level-dist { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; }
  .sentiment-bar { height: 10px; background: var(--surface2); border-radius: 10px; overflow: hidden; margin: 8px 0 4px; }
  .sentiment-fill { height: 100%; background: linear-gradient(90deg, var(--sell), var(--hold), var(--buy)); border-radius: 10px; transition: width 1s ease; }
  .news-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .news-item:last-child { border-bottom: none; }
  .news-headline { font-size: 13px; font-weight: 600; margin-bottom: 4px; line-height: 1.4; }
  .news-meta { display: flex; gap: 12px; font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; flex-wrap: wrap; }
  .news-sentiment.pos { color: var(--buy); font-weight: 700; }
  .news-sentiment.neg { color: var(--sell); font-weight: 700; }
  .news-sentiment.neu { color: var(--hold); font-weight: 700; }
  .explanation { background: var(--surface2); border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; padding: 16px 20px; font-size: 14px; line-height: 1.7; }
  .live-tag { display: inline-block; background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.25); color: var(--accent); font-size: 9px; font-family: 'Space Mono', monospace; padding: 1px 6px; border-radius: 4px; }
  .error-box { display: none; background: rgba(255,68,102,0.08); border: 1px solid rgba(255,68,102,0.3); border-radius: 12px; padding: 20px; color: var(--sell); font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
  .error-box.active { display: block; }
  .disclaimer { text-align: center; padding: 24px; font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; line-height: 1.6; border-top: 1px solid var(--border); margin-top: 32px; }
  .live-dot { display: inline-block; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; margin-right: 6px; animation: blink 1.5s infinite; vertical-align: middle; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">📈</div>
      <div class="logo-text">Stock<span>Pulse</span></div>
    </div>
    <div class="badge"><span class="live-dot"></span>AI POWERED</div>
  </div>

  <div class="search-label">// Enter ticker symbol</div>
  <div class="search-row">
    <input type="text" class="search-input" id="tickerInput" placeholder="NVDA, AAPL, TSLA..." maxlength="6">
    <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">Analyze →</button>
  </div>

  <div class="error-box" id="errorBox"></div>
  <div class="loading" id="loading">
    <div class="pulse-ring"></div>
    <div class="loading-text">ANALYZING MARKET DATA</div>
    <div class="loading-step" id="loadingStep">Searching live prices & news...</div>
  </div>
  <div class="results" id="results"></div>

  <div class="disclaimer">
    ⚠️ NOT FINANCIAL ADVICE — Educational purposes only. Always do your own research before trading.<br>
    Data researched live via web search · Analysis powered by Claude AI
  </div>
</div>

<script>
const STEPS = [
  'Searching live price data...',
  'Scanning technical indicators...',
  'Analyzing options flow...',
  'Reading latest news...',
  'Calculating support & resistance...',
  'Generating full report...'
];
let stepInterval;

function showSteps() {
  let i = 0;
  const el = document.getElementById('loadingStep');
  el.textContent = STEPS[0];
  stepInterval = setInterval(() => {
    i = Math.min(i + 1, STEPS.length - 1);
    el.textContent = STEPS[i];
  }, 1800);
}

async function analyze() {
  const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
  if (!ticker) return;

  const btn = document.getElementById('analyzeBtn');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');
  const errorBox = document.getElementById('errorBox');

  btn.disabled = true;
  errorBox.classList.remove('active');
  results.classList.remove('active');
  loading.classList.add('active');
  showSteps();

  try {
    const prompt = `You are a professional stock analyst with access to real-time web search. 
    
Search the web RIGHT NOW for current data on stock ticker: ${ticker}

Find and use:
1. Current live stock price and today's change %
2. Current RSI (14-day), MACD values, 50-day MA, 200-day MA
3. Recent support and resistance levels
4. Options data: implied volatility, put/call ratio
5. Latest 3 news headlines about this stock
6. Analyst price targets and ratings
7. Approximate 12-week closing prices for a chart

Then return ONLY a valid JSON object (absolutely no markdown, no code fences, no extra text):
{
  "ticker": "${ticker}",
  "companyName": "full company name",
  "price": 189.82,
  "change": 2.45,
  "changePct": 1.31,
  "prevClose": 187.37,
  "volume": "42.3M",
  "signal": "BUY",
  "score": 7.5,
  "scoreExplanation": "3-4 sentence beginner-friendly explanation with real numbers from your search",
  "rsi": 58.4,
  "rsiSignal": "bullish",
  "rsiNote": "one beginner sentence about this RSI value",
  "macd": "0.452",
  "macdHist": 0.123,
  "macdSignal": "bullish",
  "macdNote": "one beginner sentence",
  "sma50": 175.20,
  "sma200": 155.40,
  "maSignal": "bullish",
  "maNote": "one beginner sentence about price vs moving averages",
  "strongResistance": 210.00,
  "resistance": 200.00,
  "support": 178.00,
  "strongSupport": 165.00,
  "ivEstimate": 48.5,
  "ivRank": 62,
  "putCallRatio": 0.82,
  "unusualActivity": "brief description of notable options flow",
  "optionsSignal": "bullish",
  "optionsNote": "one beginner sentence",
  "sentimentScore": 68,
  "analystRating": "Buy",
  "analystTarget": 220.00,
  "earningsDate": "Mar 15, 2025",
  "news": [
    {"headline": "actual recent headline from search", "sentiment": "positive", "source": "source name", "age": "2h ago"},
    {"headline": "actual recent headline from search", "sentiment": "neutral", "source": "source name", "age": "5h ago"},
    {"headline": "actual recent headline from search", "sentiment": "positive", "source": "source name", "age": "1d ago"}
  ],
  "priceHistory": [160,165,158,170,175,168,180,177,185,182,188,190],
  "histLabels": ["MM-DD","MM-DD","MM-DD","MM-DD","MM-DD","MM-DD","MM-DD","MM-DD","MM-DD","MM-DD","MM-DD","MM-DD"]
}

Use real searched data. Make priceHistory reflect actual approximate weekly closes over last 12 weeks.`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 2000,
        tools: [{ type: "web_search_20250305", name: "web_search" }],
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!response.ok) throw new Error(`API error: ${response.status}`);
    const data = await response.json();

    // Extract text from all content blocks (includes tool results)
    const fullText = data.content
      .map(item => item.type === 'text' ? item.text : '')
      .filter(Boolean)
      .join('');

    // Parse JSON from response
    const jsonMatch = fullText.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('Could not parse analysis data.');
    const d = JSON.parse(jsonMatch[0]);

    clearInterval(stepInterval);
    loading.classList.remove('active');
    btn.disabled = false;
    renderResults(d);

  } catch (err) {
    clearInterval(stepInterval);
    loading.classList.remove('active');
    btn.disabled = false;
    errorBox.innerHTML = `⚠️ ${err.message || 'Analysis failed. Please try again.'}`;
    errorBox.classList.add('active');
  }
}

function pct(a, b) { return (((a - b) / b) * 100).toFixed(1); }

function renderResults(d) {
  const results = document.getElementById('results');
  const icon = d.signal === 'BUY' ? '🟢' : d.signal === 'SELL' ? '🔴' : '🟡';
  const pc = d.change >= 0 ? 'green' : 'red';
  const pa = d.change >= 0 ? '▲' : '▼';
  const price = parseFloat(d.price);

  results.innerHTML = `
    <div class="signal-banner ${d.signal}">
      <div class="signal-left">
        <div class="signal-icon">${icon}</div>
        <div>
          <div class="signal-ticker">${d.ticker} · ${d.companyName}</div>
          <div class="signal-label ${d.signal}">${d.signal} SIGNAL</div>
        </div>
      </div>
      <div class="signal-right">
        <div class="score-label">CONFIDENCE SCORE</div>
        <div class="score-value ${d.signal}">${d.score}<span style="font-size:24px;opacity:0.5">/10</span></div>
      </div>
    </div>

    <div class="grid-4">
      <div class="stat-card">
        <div class="stat-label">LIVE PRICE</div>
        <div class="stat-value blue">$${parseFloat(d.price).toFixed(2)}</div>
        <div class="stat-sub">Prev: $${parseFloat(d.prevClose).toFixed(2)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">TODAY</div>
        <div class="stat-value ${pc}">${pa} $${Math.abs(parseFloat(d.change)).toFixed(2)}</div>
        <div class="stat-sub">${parseFloat(d.changePct) >= 0 ? '+' : ''}${parseFloat(d.changePct).toFixed(2)}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">RSI (14)</div>
        <div class="stat-value ${d.rsi > 70 ? 'red' : d.rsi < 30 ? 'green' : 'yellow'}">${parseFloat(d.rsi).toFixed(1)}</div>
        <div class="stat-sub">${d.rsi > 70 ? 'Overbought' : d.rsi < 30 ? 'Oversold' : 'Neutral zone'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">ANALYST TARGET</div>
        <div class="stat-value green">$${d.analystTarget}</div>
        <div class="stat-sub">${d.analystRating} · ${pct(d.analystTarget, price)}% upside</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">Price History — 12 Weeks <span class="live-tag">SEARCHED</span></div>
        <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Support & Resistance <span class="live-tag">LIVE</span></div>
        <div class="level-row">
          <span class="level-tag resistance">STRONG RES</span>
          <span class="level-price">$${parseFloat(d.strongResistance).toFixed(2)}</span>
          <span class="level-dist">+${pct(d.strongResistance, price)}%</span>
        </div>
        <div class="level-row">
          <span class="level-tag resistance">RESISTANCE</span>
          <span class="level-price">$${parseFloat(d.resistance).toFixed(2)}</span>
          <span class="level-dist">+${pct(d.resistance, price)}%</span>
        </div>
        <div class="level-row">
          <span class="level-tag current">◆ NOW</span>
          <span class="level-price">$${price.toFixed(2)}</span>
          <span class="level-dist">—</span>
        </div>
        <div class="level-row">
          <span class="level-tag support">SUPPORT</span>
          <span class="level-price">$${parseFloat(d.support).toFixed(2)}</span>
          <span class="level-dist">${pct(d.support, price)}%</span>
        </div>
        <div class="level-row">
          <span class="level-tag support">STRONG SUP</span>
          <span class="level-price">$${parseFloat(d.strongSupport).toFixed(2)}</span>
          <span class="level-dist">${pct(d.strongSupport, price)}%</span>
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5">
          💡 <strong style="color:var(--text)">Tip:</strong> Support = buyers step in here. Resistance = sellers take profits here.
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">Technical Indicators <span class="live-tag">LIVE</span></div>
        <div class="indicator-row">
          <div class="ind-left">
            <div class="ind-name">RSI (14) — ${parseFloat(d.rsi).toFixed(2)}</div>
            <div class="ind-note">${d.rsiNote}</div>
          </div>
          <span class="ind-signal ${d.rsiSignal}">${d.rsiSignal.toUpperCase()}</span>
        </div>
        <div class="indicator-row">
          <div class="ind-left">
            <div class="ind-name">MACD — ${d.macd}</div>
            <div class="ind-note">${d.macdNote}</div>
          </div>
          <span class="ind-signal ${d.macdSignal}">${d.macdSignal.toUpperCase()}</span>
        </div>
        <div class="indicator-row">
          <div class="ind-left">
            <div class="ind-name">SMA50 $${parseFloat(d.sma50).toFixed(2)} / SMA200 $${parseFloat(d.sma200).toFixed(2)}</div>
            <div class="ind-note">${d.maNote}</div>
          </div>
          <span class="ind-signal ${d.maSignal}">${d.maSignal.toUpperCase()}</span>
        </div>
        <div class="indicator-row">
          <div class="ind-left">
            <div class="ind-name">MACD Histogram</div>
            <div class="ind-note">${parseFloat(d.macdHist) > 0 ? 'Upward momentum building' : 'Momentum fading or reversing'}</div>
          </div>
          <span style="font-family:'Space Mono',monospace;font-size:13px;${parseFloat(d.macdHist)>0?'color:var(--buy)':'color:var(--sell)'}">
            ${parseFloat(d.macdHist) > 0 ? '▲ ' : '▼ '}${Math.abs(parseFloat(d.macdHist)).toFixed(3)}
          </span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Options Flow</div>
        <div class="indicator-row">
          <div class="ind-left">
            <div class="ind-name">Implied Volatility</div>
            <div class="ind-note">How much price movement is priced in</div>
          </div>
          <span style="font-family:'Space Mono',monospace;font-size:14px;color:var(--text)">${d.ivEstimate}%</span>
        </div>
        <div class="indicator-row">
          <div class="ind-left">
            <div class="ind-name">IV Rank</div>
            <div class="ind-note">${d.ivRank > 60 ? 'Options are expensive — high premiums' : 'Options are relatively cheap'}</div>
          </div>
          <span class="ind-signal ${d.ivRank > 60 ? 'bearish' : 'bullish'}">${d.ivRank}%</span>
        </div>
        <div class="indicator-row">
          <div class="ind-left">
            <div class="ind-name">Put/Call Ratio</div>
            <div class="ind-note">Below 1.0 = more bullish call bets</div>
          </div>
          <span class="ind-signal ${d.optionsSignal}">${d.putCallRatio} · ${d.optionsSignal.toUpperCase()}</span>
        </div>
        <div class="indicator-row">
          <div class="ind-left">
            <div class="ind-name">Unusual Activity</div>
            <div class="ind-note">${d.unusualActivity}</div>
          </div>
        </div>
        <div style="margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5">💡 ${d.optionsNote}</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title">News & Market Sentiment <span class="live-tag">SEARCHED</span></div>
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:13px;color:var(--muted)">Overall Sentiment</span>
          <span style="font-family:'Space Mono',monospace;font-size:13px;color:var(--accent)">${d.sentimentScore}% Bullish</span>
        </div>
        <div class="sentiment-bar"><div class="sentiment-fill" style="width:${d.sentimentScore}%"></div></div>
      </div>
      ${d.earningsDate ? `<div style="background:rgba(77,159,255,0.1);border:1px solid rgba(77,159,255,0.3);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--accent3)">📅 <strong>Earnings Date:</strong> ${d.earningsDate} — options premiums spike near earnings</div>` : ''}
      ${(d.news || []).map(n => `
        <div class="news-item">
          <div class="news-headline">${n.headline}</div>
          <div class="news-meta">
            <span>${n.source}</span>
            <span>${n.age}</span>
            <span class="news-sentiment ${n.sentiment === 'positive' ? 'pos' : n.sentiment === 'negative' ? 'neg' : 'neu'}">
              ${n.sentiment === 'positive' ? '▲ POSITIVE' : n.sentiment === 'negative' ? '▼ NEGATIVE' : '◆ NEUTRAL'}
            </span>
          </div>
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="card-title">AI Summary — Why ${d.signal}?</div>
      <div class="explanation">${d.scoreExplanation}</div>
    </div>
  `;

  results.classList.add('active');

  // Draw chart
  const ctx = document.getElementById('priceChart').getContext('2d');
  const ph = d.priceHistory || [];
  const isUp = ph.length > 1 && ph[ph.length - 1] >= ph[0];
  const lc = isUp ? '#00ff88' : '#ff4466';
  const labels = d.histLabels || ph.map((_, i) => `W-${ph.length - i}`);

  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: ph,
        borderColor: lc,
        borderWidth: 2,
        fill: true,
        backgroundColor: (ctx2) => {
          const { ctx: c, chartArea } = ctx2.chart;
          if (!chartArea) return 'transparent';
          const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
          g.addColorStop(0, isUp ? 'rgba(0,255,136,0.2)' : 'rgba(255,68,102,0.2)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          return g;
        },
        tension: 0.4, pointRadius: 0, pointHoverRadius: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `$${c.parsed.y.toFixed(2)}` } } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#6b6b88', font: { family: 'Space Mono', size: 9 }, maxRotation: 45 } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#6b6b88', font: { family: 'Space Mono', size: 9 }, callback: v => '$' + v } }
      }
    }
  });
}

document.getElementById('tickerInput').addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
</script>
</body>
</html>
